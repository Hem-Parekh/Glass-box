<title>Glass-Box Advisory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
/* Layout: public site = full-width bands on a 1160px container; workspace = top bar + left rail + content column.
   Identity: a glass-box ledger. Navy ink, teal "verified" accent, orange for equity; numbers set in mono and clickable. */
:root{
  --navy:#12263F;--teal:#1AA6A0;--orange:#F2A541;
  --bg:#FBFCFD;--surface:#FFFFFF;--surface-2:#F2F6FA;--line:#DCE3EA;--line-2:#C9D3DD;
  --ink:#12263F;--ink-2:#3C4D60;--muted:#62728A;--accent:#0F857F;--accent-ink:#FFFFFF;
  --s-debt:#2F6BB3;--s-equity:#D9861C;--s-mix:#139A8F;--grid:#E8EDF2;--axis:#B7C2CE;
  --good:#1E7F4F;--good-bg:#E5F4EC;--warn:#9A6200;--warn-bg:#FDF2DC;--bad:#B3261E;--bad-bg:#FBE9E7;
  --band:#12263F;--band-ink:#FFFFFF;--band-sub:#B9CCE0;
  --f-sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1520;--surface:#111D2B;--surface-2:#162436;--line:#24364A;--line-2:#2F465E;
  --ink:#EAF1F8;--ink-2:#C3D0DD;--muted:#93A5B8;--accent:#2BC1BA;--accent-ink:#06201F;
  --s-debt:#5A8FD6;--s-equity:#CF8526;--s-mix:#21A89E;--grid:#1C2C3E;--axis:#3A5068;
  --good:#5BCB91;--good-bg:#12301F;--warn:#F2B552;--warn-bg:#33270F;--bad:#FF8A80;--bad-bg:#3A1A18;
  --band:#08111B;--band-ink:#FFFFFF;--band-sub:#A5BCD3;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1520;--surface:#111D2B;--surface-2:#162436;--line:#24364A;--line-2:#2F465E;
  --ink:#EAF1F8;--ink-2:#C3D0DD;--muted:#93A5B8;--accent:#2BC1BA;--accent-ink:#06201F;
  --s-debt:#5A8FD6;--s-equity:#CF8526;--s-mix:#21A89E;--grid:#1C2C3E;--axis:#3A5068;
  --good:#5BCB91;--good-bg:#12301F;--warn:#F2B552;--warn-bg:#33270F;--bad:#FF8A80;--bad-bg:#3A1A18;
  --band:#08111B;--band-ink:#FFFFFF;--band-sub:#A5BCD3;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
h1,h2,h3,h4{text-wrap:balance;margin:0;line-height:1.2;color:var(--ink)}
h1{font-family:var(--f-serif);font-weight:600;font-size:clamp(28px,4vw,40px);letter-spacing:-.01em}
h2{font-size:21px;font-weight:600}
h3{font-size:16px;font-weight:600}
p{margin:0}
code{font-family:var(--f-mono);font-size:.9em}
.container{max-width:1160px;margin:0 auto;padding-inline:20px}
.muted{color:var(--muted)}.small{font-size:13px}
.row{display:flex;flex-wrap:wrap;align-items:center}.gap{gap:12px}.gap-s{gap:8px}.grow{flex:1;min-width:0}
.eyebrow{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.t-good{color:var(--good)}.t-warn{color:var(--warn)}.t-bad{color:var(--bad)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:600;font-size:14px;border-radius:6px;padding:9px 16px;border:1px solid transparent;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-2)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.lg{padding:12px 20px;font-size:15px}.btn.sm{padding:6px 11px;font-size:13px}.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--accent);text-decoration:underline;cursor:pointer}
/* public header */
.pub-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.pub-head-in{display:flex;align-items:center;gap:20px;min-height:64px}
.logo{display:inline-flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;font-size:17px;font-weight:500;white-space:nowrap}
.logo b{font-weight:700}
.logo-mark{display:grid;grid-template-columns:repeat(2,9px);gap:3px}
.logo-mark i{width:9px;height:9px;border:2px solid var(--ink);border-radius:2px}
.logo-mark i:nth-child(4){background:var(--teal);border-color:var(--teal)}
.pub-nav{display:flex;gap:4px;flex:1;justify-content:center;flex-wrap:wrap}
.pub-nav a{color:var(--ink-2);text-decoration:none;font-size:14px;padding:6px 10px;border-radius:6px}
.pub-nav a:hover,.pub-nav a[aria-current]{color:var(--ink);background:var(--surface-2)}
.pub-cta{display:flex;gap:8px}
.menu-btn{display:none}
@media (max-width:980px){
  .pub-nav{display:none;position:absolute;left:0;right:0;top:64px;background:var(--surface);border-bottom:1px solid var(--line);flex-direction:column;padding:10px 16px}
  .pub-nav.open{display:flex}.menu-btn{display:inline-flex;margin-left:auto}.pub-cta .ghost{display:none}
}
@media (max-width:560px){.pub-cta{display:none}}
/* hero */
.hero{padding-block:56px 64px;border-bottom:1px solid var(--line)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:48px;align-items:center}
@media (max-width:900px){.hero-grid{grid-template-columns:minmax(0,1fr)}}
.hero h1{font-size:clamp(36px,5.6vw,60px);line-height:1.04;margin-bottom:18px}
.lede{font-size:18px;color:var(--ink-2);max-width:56ch;margin-bottom:24px}
.lede-s{font-size:16.5px;color:var(--ink-2);max-width:68ch;margin-block:8px 24px}
.hero .row{margin-bottom:14px}
.hero-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;box-shadow:0 1px 0 var(--line),0 18px 40px -24px rgba(18,38,63,.35);display:grid;gap:16px}
.hc-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.hc-top .eyebrow{margin:0}
.hc-q{font-size:17px}
.hc-bar{display:flex;height:16px;border-radius:4px;overflow:hidden;gap:2px;background:var(--surface)}
.hc-bar i{display:block}.hc-bar .d,.hc-legend .d{background:var(--s-debt)}.hc-bar .e,.hc-legend .e{background:var(--s-equity)}
.hc-legend{display:flex;justify-content:space-between;margin-top:8px;font-size:14px}
.hc-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.hc-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hc-stats div{background:var(--surface-2);border-radius:6px;padding:10px 12px}
.hc-stats small{display:block;color:var(--muted);font-size:12px}
.hc-stats b{font-size:20px}
.hc-hint{font-size:12.5px;color:var(--muted)}
/* glass-box numbers */
.gx{font:inherit;font-family:var(--f-mono);font-weight:500;color:inherit;background:none;border:0;padding:0 1px;cursor:pointer;border-bottom:1.5px dotted var(--accent);font-variant-numeric:tabular-nums}
.gx:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}
b .gx,.kpi b .gx,.hc-stats b .gx{font-weight:600}
#explain{position:fixed;inset:0;z-index:50;background:rgba(8,17,27,.45);display:flex;justify-content:flex-end}
#explain[hidden]{display:none!important}
.xp{width:min(460px,100%);height:100%;background:var(--surface);border-left:1px solid var(--line);padding:22px;overflow:auto;padding-top:calc(22px + env(safe-area-inset-top,0px))}
.xp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.xp-body{display:grid;gap:10px}
.xp-label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.formula{font-family:var(--f-mono);font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:10px 12px;white-space:pre-wrap;margin:0;color:var(--ink)}
.xp-ver{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.src{display:inline-block;font-style:normal;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2);vertical-align:1px}
.src-founder{border-color:var(--s-debt);color:var(--s-debt)}.src-benchmark{border-color:var(--s-equity);color:var(--warn)}.src-advisor{border-color:var(--s-mix);color:var(--accent)}
/* sections */
.band{background:var(--band);color:var(--band-ink);padding-block:40px}
.band h3{color:var(--band-ink);margin-bottom:8px}.band p{color:var(--band-sub)}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
@media (max-width:820px){.three{grid-template-columns:minmax(0,1fr)}}
.sec{padding-block:56px}.sec.alt{background:var(--surface-2)}
.sec h2{font-family:var(--f-serif);font-size:clamp(24px,3vw,30px);margin-bottom:8px}
.pillars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin-top:24px;border-top:1px solid var(--line)}
.pillars div{padding:20px 20px 20px 0;border-bottom:1px solid var(--line)}
.pillars h3{margin-bottom:6px}.pillars p{color:var(--ink-2);max-width:40ch}
@media (max-width:820px){.pillars{grid-template-columns:minmax(0,1fr)}}
.pipeline{list-style:none;padding:0;margin:24px 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;counter-reset:s}
.pipeline li{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:4px;align-content:start}
.pipeline li span:last-child{color:var(--ink-2);font-size:14px}
@media (max-width:820px){.pipeline{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.pipeline{grid-template-columns:minmax(0,1fr)}}
.step{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-family:var(--f-mono);font-size:13px}
:root[data-theme="dark"] .step{background:var(--accent);color:var(--accent-ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .step{background:var(--accent);color:var(--accent-ink)}}
.golden{border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface));border-radius:var(--r);padding:16px 18px;max-width:80ch}
.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:22px}
.feature{display:grid;gap:8px;align-content:start;padding:18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-decoration:none;color:var(--ink)}
.feature:hover{border-color:var(--accent)}.feature p{color:var(--ink-2);font-size:14px}.feature .go{color:var(--accent);font-size:13.5px;font-weight:600}
.cta-band{display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:center;background:var(--band);color:var(--band-ink);border-radius:12px;padding:28px}
.cta-band h2{color:var(--band-ink);margin-bottom:6px}.cta-band p{color:var(--band-sub)}
.page{padding-block:40px 64px;display:grid;gap:22px}
.page.narrow{max-width:720px}
.card-sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:grid;gap:12px;min-width:0}
.two-col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
@media (max-width:820px){.two-col{grid-template-columns:minmax(0,1fr)}}
.steps{margin:0;padding-left:22px;display:grid;gap:6px}.steps li{padding-left:4px}
.ticks{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ticks li{padding-left:22px;position:relative}.ticks li::before{content:"";position:absolute;left:2px;top:.55em;width:10px;height:6px;border-left:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(-45deg)}
.note{border-left:3px solid var(--accent);padding-left:12px;color:var(--ink-2)}
.roadmap{list-style:none;margin:0;padding:0;display:grid;gap:14px}.roadmap li{display:flex;gap:14px}
/* footer */
.pub-foot{border-top:1px solid var(--line);padding-block:36px 28px;background:var(--surface)}
.foot-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:24px}
.foot-grid h4{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.foot-grid a{display:block;color:var(--ink-2);text-decoration:none;font-size:14px;padding-block:3px}
.foot-grid p{margin-top:10px;max-width:36ch}
.fine{margin-top:24px;font-size:12.5px;color:var(--muted)}
@media (max-width:760px){.foot-grid{grid-template-columns:1fr 1fr}}
/* tables */
.tw{overflow-x:auto;max-width:100%}
.tbl{border-collapse:collapse;width:100%;font-size:14px}
.tbl th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom:1.5px solid var(--line-2);padding:8px 10px;white-space:nowrap}
.tbl td{border-bottom:1px solid var(--line);padding:9px 10px;vertical-align:top}
.tbl td.strong{font-weight:600;white-space:nowrap}
.tbl .num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
/* forms */
.form{display:grid;gap:14px}
.fields{display:grid;gap:12px}.f2{grid-template-columns:repeat(2,minmax(0,1fr))}.f3{grid-template-columns:repeat(3,minmax(0,1fr))}.f4{grid-template-columns:repeat(4,minmax(0,1fr))}.f5{grid-template-columns:repeat(5,minmax(0,1fr));align-items:end}
@media (max-width:900px){.f4,.f5,.f3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.f2,.f3,.f4,.f5{grid-template-columns:minmax(0,1fr)}}
.fld{display:grid;gap:5px;min-width:0;align-content:end}
.fld>span:first-child{font-size:13px;color:var(--ink-2)}
.fld.inline{display:flex;align-items:center;gap:8px}
.in{display:flex;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);overflow:hidden;min-width:0}
.in:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.in input,.in select,.in textarea{flex:1;min-width:0;width:100%;border:0;background:transparent;color:var(--ink);font:inherit;padding:9px 11px;outline:none}
.in input{font-variant-numeric:tabular-nums}
.in em{font-style:normal;font-size:12.5px;color:var(--muted);padding:9px 10px;border-left:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.in.sm input{padding:5px 8px;width:110px}
.checkset{display:grid;gap:8px;font-size:14px}
.form-err{color:var(--bad);font-size:14px}
fieldset.seg{border:0;padding:0;margin:0;display:flex;gap:8px;flex-wrap:wrap}
fieldset.seg legend{font-size:13px;color:var(--ink-2);margin-bottom:6px}
.seg label{flex:1}.seg input{position:absolute;opacity:0}
.seg span{display:block;text-align:center;border:1px solid var(--line-2);border-radius:6px;padding:9px;cursor:pointer;font-weight:500}
.seg input:checked+span{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--ink)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.slider{display:grid;gap:4px;font-size:14px}.slider input{width:100%;accent-color:var(--accent)}
/* notices, chips */
.notice{border:1px solid var(--line-2);background:var(--surface-2);border-radius:6px;padding:11px 14px;font-size:14px}
.notice.ok{border-color:var(--good);background:var(--good-bg)}.notice.bad{border-color:var(--bad);background:var(--bad-bg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;max-width:min(560px,92vw);box-shadow:0 10px 30px rgba(0,0,0,.2)}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:6px;opacity:.8}
.chip.ok{background:var(--good-bg);color:var(--good);border-color:transparent}.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.stamp{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);border:1.5px solid var(--accent);border-radius:4px;padding:3px 8px;transform:rotate(-1.5deg)}
.stamp::before{content:"✓";font-weight:700}
/* auth */
.auth{min-height:70vh;display:grid;place-items:start center;padding:48px 16px}
.auth-card{width:min(460px,100%);display:grid;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px}
.demo-box{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:8px}
.demo-roles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.role-btn{display:grid;gap:2px;text-align:left;font:inherit;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:10px;cursor:pointer;color:var(--ink)}
.role-btn:hover{border-color:var(--accent)}.role-btn span{font-size:12px;color:var(--muted)}
/* workspace */
.ws{display:grid;grid-template-columns:230px minmax(0,1fr);grid-template-rows:auto 1fr;min-height:100%}
.ws-top{grid-column:1/-1;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.ws-user{margin-left:auto;display:flex;align-items:center;gap:12px}
.ws-user span{display:grid;text-align:right;line-height:1.25}.ws-user small{color:var(--muted);font-size:12px}
.ws-nav{border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:2px;background:var(--surface)}
.ws-nav a{color:var(--ink-2);text-decoration:none;padding:8px 12px;border-radius:6px;font-size:14.5px}
.ws-nav a:hover{background:var(--surface-2)}
.ws-nav a[aria-current]{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.ws-nav .linkbtn{margin:14px 12px 0;text-align:left;color:var(--muted)}
.ws-main{padding:24px 28px 56px;display:grid;gap:18px;align-content:start;min-width:0}
@media (max-width:860px){.ws{grid-template-columns:minmax(0,1fr)}.ws-nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}.ws-nav a{white-space:nowrap}.ws-main{padding:18px 16px 48px}.ws-user span{display:none}}
.pg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.pg-head h1{font-size:clamp(24px,3vw,30px);margin-bottom:4px}
.pg-head p{max-width:72ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px;min-width:0;align-content:start}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:980px){.grid2{grid-template-columns:minmax(0,1fr)}}
.kpis{display:grid;gap:12px}.k3{grid-template-columns:repeat(3,minmax(0,1fr))}.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.k4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.k3,.k4{grid-template-columns:minmax(0,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px;align-content:start;min-width:0}
.panel .kpi{background:var(--surface-2);border-color:transparent}
.kpi small{font-size:12px;color:var(--muted)}
.kpi b{font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi.accent{box-shadow:inset 0 3px 0 var(--accent)}
.twin{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:18px;align-items:start}
.twin-out{display:grid;gap:18px;min-width:0}
.twin-in{position:sticky;top:76px}
@media (max-width:1080px){.twin{grid-template-columns:minmax(0,1fr)}.twin-in{position:static}}
.rule{font-family:var(--f-serif);font-size:20px;line-height:1.35;border-left:3px solid var(--accent);padding-left:14px}
.narr{font-family:var(--f-serif);font-size:17px;line-height:1.55;max-width:70ch}
.checklist,.checks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.checklist li,.checks li{padding-left:28px;position:relative}
.checklist li::before,.checks li::before{content:"";position:absolute;left:0;top:2px;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-2)}
.checklist li.done::before,.checks li.done::before{background:var(--accent);border-color:var(--accent)}
.checklist li.done::after,.checks li.done::after{content:"";position:absolute;left:6px;top:6px;width:6px;height:9px;border-right:2px solid var(--accent-ink);border-bottom:2px solid var(--accent-ink);transform:rotate(45deg)}
.checklist li.done a{color:var(--muted);text-decoration:line-through}
.item{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;padding-block:10px;border-bottom:1px solid var(--line)}
.item.col{display:grid}.item>div:first-child{display:grid}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;align-content:start}
.card-top{display:flex;justify-content:space-between;gap:10px}.card-top>div{display:grid}
.score{font-family:var(--f-mono);font-size:24px;font-weight:500;color:var(--accent);line-height:1}.score small{font-size:12px;color:var(--muted)}
.reasons{margin:0;padding-left:18px;font-size:13.5px;color:var(--ink-2);display:grid;gap:2px}
.docs{list-style:none;margin:0;padding:0}.docs li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.flags{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.flags li{border-left:3px solid var(--line-2);padding:6px 10px;background:var(--surface-2);border-radius:0 6px 6px 0;font-size:14px}
.flags li.high{border-color:var(--bad)}.flags li.medium{border-color:var(--warn)}.flags li.low{border-color:var(--s-debt)}
.flags b{margin-right:6px}
.factors{list-style:none;margin:0;padding:0}.factors li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.pts{font-family:var(--f-mono);white-space:nowrap}
.meter{display:grid;gap:6px}.meter-top{display:flex;justify-content:space-between;align-items:baseline}.meter-top b{font-family:var(--f-mono);font-size:28px}.meter-top small{font-size:13px;color:var(--muted)}
.meter-bar{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}.meter-bar i{display:block;height:100%;border-radius:5px}
.meter-bar .good{background:var(--good)}.meter-bar .warn{background:var(--warn)}.meter-bar .bad{background:var(--bad)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent);font-weight:600}
.progress{display:flex;gap:3px;margin-top:6px}.progress i{width:18px;height:4px;border-radius:2px;background:var(--line)}.progress i.on{background:var(--accent)}
.tsteps{margin:0;padding-left:22px;display:grid;gap:4px}.tsteps li.done{color:var(--muted);text-decoration:line-through}
.nda{display:grid;gap:10px;background:var(--surface-2);border-radius:6px;padding:14px}
.empty{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:28px;text-align:center;display:grid;gap:6px;color:var(--ink-2)}
.calc-out{display:grid;gap:12px}
.total{font-size:15px}
/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .tick{font-size:11px;fill:var(--muted);font-family:var(--f-mono)}
.chart .lab{font-size:13px;fill:var(--ink-2)}
.chart .val,.chart .dl{font-size:12px;fill:var(--ink);font-family:var(--f-mono);font-weight:500}
.chart .reflab{font-size:11px;fill:var(--ink-2)}
.chartwrap{position:relative}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--ink-2);margin-top:4px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.legend i.dash{background:none;border-top:2px dashed;height:0}
.tip{position:absolute;top:6px;background:var(--surface);border:1px solid var(--line-2);border-radius:6px;padding:8px 10px;font-size:12.5px;box-shadow:0 8px 20px rgba(0,0,0,.12);pointer-events:none;min-width:150px}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
