name: Backend - tests on PostgreSQL

on:
  push:
    paths: ["backend/**", "server/**", "site/**", "Dockerfile", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "server/**", "site/**", "Dockerfile", ".github/workflows/backend.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
          POSTGRES_DB: aegis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aegis" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: python -m pip install -r backend/requirements.txt -r server/requirements.txt
      - name: Backend tests on PostgreSQL (includes the full prototype suite)
        env:
          GB_TEST_DATABASE_URL: postgresql+psycopg://aegis:aegis@127.0.0.1:5432/aegis_test
        run: python -m pytest -q backend/tests
      - name: Prototype server, CMA tool and demo-store tests
        run: |
          python -m pytest -q server/tests fundmix/tests
          node site/tests/store.test.js
      - name: Docker image builds
        run: docker build -t aegis-backend .
