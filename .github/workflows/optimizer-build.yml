name: Equity vs Debt Optimizer - test and build

on:
  push:
    paths: ["optimizer/**", ".github/workflows/optimizer-build.yml"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            file: EquityDebtOptimizer.exe
          - os: macos-latest
            file: EquityDebtOptimizer
          - os: ubuntu-latest
            file: EquityDebtOptimizer
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: optimizer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q
      - name: Build
        run: python build.py
      - name: Smoke test (start the app, check it answers)
        shell: bash
        run: |
          EDO_NO_BROWSER=1 ./dist/${{ matrix.file }} > app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fs http://127.0.0.1:8501/_stcore/health >/dev/null; then echo "up after ${i}s"; exit 0; fi
            sleep 1
          done
          cat app.log; exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: EquityDebtOptimizer-${{ runner.os }}
          path: optimizer/dist/${{ matrix.file }}
          if-no-files-found: error
